<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5c2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golfträning">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Golfträning</title>
<style>
:root{
  --bg:#fff; --fg:#000; --muted:#222; --card:#f1f1f1; --line:#000;
  --accent:#0a5c2b; --accentFg:#fff; --btn:#000; --btnFg:#fff;
  --warn:#b00020; --dl:#ffd400; --dlFg:#000; --hl:#e6f2ea;
}
:root[data-theme=dark]{
  --bg:#000; --fg:#fff; --muted:#e5e5e5; --card:#151515; --line:#fff;
  --accent:#3ddc84; --accentFg:#000; --btn:#fff; --btnFg:#000;
  --warn:#ff6b6b; --dl:#ffd400; --dlFg:#000; --hl:#0d2a19;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:20px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-variant-numeric:tabular-nums; touch-action:manipulation;
  padding:0 max(12px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
header.top{
  position:sticky; top:0; z-index:10; background:var(--bg);
  margin:0 -12px; padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  border-bottom:3px solid var(--line); display:flex; gap:6px; align-items:center;
}
.tabs{display:flex; flex:1; gap:6px}
.tab{flex:1; min-height:52px; border:3px solid var(--line); background:var(--bg); border-radius:12px; font-weight:800; font-size:17px; padding:0 4px}
.tab[aria-selected=true]{background:var(--btn); color:var(--btnFg)}
.tab.icon{flex:none; width:52px; font-size:24px}
.theme{width:52px; min-height:52px; border:3px solid var(--line); background:var(--bg); border-radius:12px; font-size:22px; flex:none}

h1{font-size:28px; line-height:1.15; margin:16px 0 8px; font-weight:900}
h2{font-size:22px; margin:22px 0 8px; font-weight:900}
h3{font-size:20px; margin:0 0 4px; font-weight:800}
p{margin:0 0 12px}
.muted{color:var(--muted); font-weight:600}
.small{font-size:17px}
.box{border:3px solid var(--line); border-radius:18px; padding:14px; margin:12px 0; background:var(--bg)}
.box.soft{background:var(--card)}
.box.alert{border-color:var(--accent); background:var(--hl)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.grow{flex:1}

.btn{display:block; width:100%; min-height:68px; border-radius:16px; border:3px solid var(--line); background:transparent; font-weight:900; font-size:21px; padding:8px 12px; margin:8px 0}
.btn.primary{background:var(--accent); color:var(--accentFg); border-color:var(--accent)}
.btn.dark{background:var(--btn); color:var(--btnFg)}
.btn.danger{color:var(--warn); border-color:var(--warn)}
.btn.small{min-height:52px; font-size:18px}
.btn.huge{min-height:96px; font-size:26px}
.btn:disabled{opacity:.4}
.btn .sub{display:block; font-size:16px; font-weight:600; opacity:.85}
.inline{display:inline-block; width:auto; margin:0}
.btnrow{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btnrow .btn{margin:0}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
.chip{min-height:56px; padding:0 16px; border-radius:28px; border:3px solid var(--line); background:transparent; font-weight:800; font-size:19px}
.chip[aria-pressed=true]{background:var(--btn); color:var(--btnFg)}

.list .item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; min-height:72px; border:3px solid var(--line); border-radius:16px; background:transparent; padding:10px 14px; margin:8px 0}
.item .t{flex:1; font-weight:800}
.item .t small{display:block; font-weight:600; font-size:16px; color:var(--muted)}
.item .go{font-size:26px; font-weight:900}

.numgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:10px 0}
.numgrid.c3{grid-template-columns:repeat(3,1fr)}
.numgrid.c6{grid-template-columns:repeat(6,1fr)}
.numgrid button{min-height:76px; border-radius:16px; border:3px solid var(--line); background:transparent; font-size:30px; font-weight:900}
.numgrid button[aria-pressed=true]{background:var(--accent); color:var(--accentFg); border-color:var(--accent)}
.numgrid.c6 button{font-size:24px; min-height:64px}
.numgrid.aim{grid-template-columns:repeat(4,minmax(0,1fr))}
.numgrid.aim button{font-size:26px; min-height:64px}

.runhead{padding:12px 0 2px}
.runhead .crumb{font-weight:700; color:var(--muted); font-size:17px}
.series{border:3px solid var(--line); border-radius:18px; padding:12px 14px; margin:12px 0}
.series .shot{display:flex; gap:12px; padding:10px 0; border-bottom:2px solid var(--card)}
.series .shot:last-child{border-bottom:0}
.series .n{flex:none; width:40px; height:40px; border-radius:50%; background:var(--btn); color:var(--btnFg); display:grid; place-items:center; font-weight:900}
.series .big{font-size:30px; font-weight:900; line-height:1.15}
.series .sub{font-size:21px; font-weight:700}
.series .head{font-size:34px; font-weight:900; margin-bottom:4px}
.dl{display:inline-block; margin-top:6px; background:var(--dl); color:var(--dlFg); border-radius:10px; padding:4px 10px; font-weight:900; font-size:19px}
.explain{background:var(--card); border-radius:14px; padding:10px 12px; font-weight:700; font-size:18px; margin:8px 0}
.prog{font-weight:800; font-size:18px; color:var(--muted)}

.stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0}
.stat{background:var(--card); border-radius:12px; padding:8px 12px}
.stat b{display:block; font-size:24px}
.stat span{font-size:15px; font-weight:700; color:var(--muted)}
.ref{font-size:17px; font-weight:600; margin-top:6px}
.ref .src{display:block; color:var(--muted); font-size:15px}

.shotcard{border:3px solid var(--line); border-radius:18px; padding:14px; margin:12px 0}
.shotcard .no{font-weight:800; color:var(--muted)}
.shotcard .big{font-size:34px; font-weight:900; line-height:1.15}
.opts{display:grid; gap:10px}
.opts.c2{grid-template-columns:1fr 1fr}
.opts.c3{grid-template-columns:1fr 1fr 1fr}
.opts .btn{margin:0; min-height:80px}
.dots{display:flex; flex-wrap:wrap; gap:4px; margin:10px 0}
.dots i{width:14px; height:14px; border-radius:50%; border:2px solid var(--line)}
.dots i.on{background:var(--fg)}

label.f{display:block; font-weight:800; margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],select{
  width:100%; min-height:60px; border:3px solid var(--line); border-radius:14px; background:var(--bg); padding:0 12px; font-size:22px; font-weight:700
}
.check{display:flex; align-items:center; gap:12px; min-height:56px; font-weight:700}
.check input{width:30px; height:30px; accent-color:var(--accent); flex:none}
.stepper{display:grid; grid-template-columns:76px 1fr 76px; gap:10px; align-items:center}
.stepper button{min-height:68px; border-radius:16px; border:3px solid var(--line); background:transparent; font-size:34px; font-weight:900}
.stepper output{text-align:center; font-size:36px; font-weight:900}

table.t{border-collapse:collapse; width:100%; font-size:16px}
table.t th,table.t td{border:2px solid var(--line); padding:6px 4px; text-align:center}
table.t th{background:var(--card)}
.scroll{overflow-x:auto}
svg.chart{width:100%; height:110px; display:block}
svg.chart polyline{fill:none; stroke:var(--accent); stroke-width:3}
svg.chart circle{fill:var(--accent)}
svg.chart text{fill:var(--fg); font-size:12px; font-weight:700}
svg.chart line{stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(200%);
  background:var(--btn); color:var(--btnFg); padding:14px 20px; border-radius:14px; font-weight:800; transition:transform .25s; max-width:90vw; text-align:center; z-index:20}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

  chip: { dl: true, explain: true, shot: c => ({ flag: flagOf(), target: pick(TARGETS), club: pick(clubsAt(c.place, CHIP_CLUBS)), height: pick(HEIGHTS) }) },
  heights3: { dl: true, len: 3,

  bunker: { dl: true, explain: true, shot: c => ({ flag: flagOf(), target: pick(TARGETS), club: pick(clubsAt(c.place, BUNKER_CLUBS)), height: pick(HEIGHTS), lie: pick(Object.keys(L.gen.bunkerLies)) }) },
  range: { dl: true, explain: true, shot: c => ({ flag: flagOf(), target: pick(TARGETS), club: pick(clubsAt(c.place, IRON_WEDGES)), height: pick(HEIGHTS), shape: pick(SHAPES) }) },
  justPast: { pre: c => ({ dist: (() => { let d; do d = 40 + rnd(61); while (c.prevPre && Math.abs(d - c.prevPre.dist) < 10); return d; })() }),

function makeSeries(kind, ctx) {
  const g = GENS[kind], pre = g.pre ? g.pre(ctx) : {}, shots = [];
  let prev = ctx.prevKey;
  for (let i = 0; i < ctx.len; i++) {
    let s, k, n = 0;
    do { s = g.shot(ctx, pre, i); k = JSON.stringify(s); } while (k === prev && ++n < 50);   // aldrig två likadana slag i rad
    shots.push(s); prev = k;
  }
  if (g.dl && Math.random() < 0.5) shots[rnd(shots.length)].dl = pick(DLS);              // högst ett DL-inslag per serie
  return { shots, pre, lastKey: prev };
}

function shotHTML(kind, s) {
  const G = L.gen;
  let big = '', sub = [];
  if (kind === 'shortPutt') { big = t('ui.lengthM', { d: fmtN(s.dist) }); sub = [t('gen.clock', { c: s.clock }), G.newHole]; }
  else if (kind === 'lagPutt') big = t('ui.lengthM', { d: s.dist });
  else if (kind === 'justPast') big = G.heights[s.height];
  else if (kind === 'coins') { big = club(s.club); sub = [G.ballPos[s.pos], G.stances[s.stance]]; }
  else {
    big = (s.flag ? s.flag + ' · ' : '') + G.targets[s.target];
    sub = [club(s.club), G.heights[s.height]];
    if (s.shape) sub.push(G.shapes[s.shape]);
    if (s.lie) sub.push(G.bunkerLies[s.lie]);
  }
  return `<div class="big">${big}</div>${sub.length ? `<div class="sub">${sub.join(' · ')}</div>` : ''}${s.dl ? `<span class="dl">${G.dlPrefix}${G.dl[s.dl]}</span>` : ''}`;
}

const tstate = id => D.tests[id] || (D.tests[id] = { level: TESTS[id].level ? TESTS[id].level.start : null, results: [] });
const lvlText = (id, v) => v == null ? '' : t('test.' + id + '.lvl', { v: fmtN(v) });
function fmtVal(id, r) {
  const T = TESTS[id];
  if (T.kind === 'count') return `${r.v}/${T.n}`;
  if (id === 'ball50') return `${r.v}`;
  if (id === 'lagSGF') return fmtS(r.v, 0) || '0';
  if (id === 'driver') return r.v == null ? '–' : fmtS(r.v);
  if (id === 'btb3') return fmtN(r.v) + '/10';
  if (id === 'ball8') return `${r.v}/160`;
  if (id === 'twoSix') return `${r.v}/${r.of}`;
  if (id === 'gc2Rand') return `${fmtN(r.v)} m`;
  if (id === 'aimPoint') return `${fmtN(r.v, 2)} %`;
  return String(r.v);
}
function bestOf(id) {
  const rs = tstate(id).results.filter(r => r.v != null && (id !== 'twoSix' || r.of));
  if (!rs.length) return null;
  const score = r => id === 'twoSix' ? r.v / r.of : r.v;
  return rs.reduce((b, r) => (TESTS[id].higher ? score(r) > score(b) : score(r) < score(b)) ? r : b);
}

const KEY = 'golftraning.v2';
const defaults = () => ({ v: 2, settings: { pile: 16, seriesLen: 4, flags: 2, theme: null }, places: DEFAULT_PLACES(), placeId: 'brohof',
  sessions: [], tests: {}, yardage: {}, period: null, cur: null });

function v1Lines(r) {
  const pct = (h, a) => a ? Math.round(h / a * 100) + ' %' : '–', out = [], b = r.b || {}, V = 'v1.lines.';
  const hit = (id, key) => { const x = b[id]; if (x && (x.a || x.h)) out.push(t(V + key, { h: x.h, a: x.a, p: pct(x.h, x.a) }) + (id === 'chip' && x.a ? t(V + 'base', { b: x.base ?? 0, n: Math.min(x.a, 10) }) : '')); };
  hit('chip', 'chip'); hit('bunker', 'bunker'); hit('putt', 'putt'); hit('lag', 'lag'); hit('updown', 'updown');
  const i = b.inspel; if (i && (i.k + i.l + i.p)) out.push(t(V + 'inspel', { k: i.k, l: i.l, pl: i.p, p: pct(i.p, i.k + i.l + i.p) }));
  return out;
}
function migrateV1(d) {
  const hist = LS.get('narspel.hist', []);
  if (Array.isArray(hist)) hist.forEach(r => d.sessions.push({ id: 'v1-' + r.id, date: r.start, placeName: t('ui.v1Place'), v1: true,
    items: [{ kind: 'module', id: 'v1', name: t('v1.name'), lines: v1Lines(r) }] }));
  const th = LS.get('narspel.theme', null); if (th) d.settings.theme = th;
  d.sessions.sort((a, b) => b.date.localeCompare(a.date));
  return d;   // de gamla nycklarna lämnas orörda
}
function load() {
  const d = LS.get(KEY, null);
  if (!d || d.v !== 2) return migrateV1(defaults());
  const base = defaults();
  if (d.cur) d.cur.queue.forEach((q, i) => { if (q.id === 'gc2Past') { q.id = 'gc2Rand'; if (i === d.cur.qi) { d.cur.si = 0; d.cur.st = {}; } } });   // ersatt modul
  return { ...base, ...d, settings: { ...base.settings, ...d.settings } };
}
let D = load();
const save = () => LS.set(KEY, D);
const placeById = id => D.places.find(p => p.id === id);
const curPlace = () => placeById(D.placeId) || D.places[0];

// =====================================================================
// Pass: kö av moduler/tester, steg och resultat
// =====================================================================
let view = D.cur ? 'run' : 'home', editPlaceId = null, lastSaved = null;
const qItem = () => D.cur && D.cur.queue[D.cur.qi];
const runPlace = () => placeById(D.cur?.placeId) || curPlace();
const stepsOf = q => q.kind === 'module' ? MODULES[q.id].steps : [{ type: 'test', test: q.id }];

function startItems(items) {
  if (!D.cur) D.cur = { id: uid(), date: new Date().toISOString(), placeId: D.placeId, queue: [], qi: 0, si: 0, st: {}, items: [] };
  const was = D.cur.queue.length;
  D.cur.queue.push(...items);
  if (D.cur.qi >= was) { D.cur.qi = was; D.cur.si = 0; D.cur.st = {}; beginItem(); }
  view = 'run'; save(); render(); scrollTo(0, 0); syncWake();
}
function beginItem() {
  const q = qItem();
  if (q && q.kind === 'module') D.cur.items.push({ kind: 'module', id: q.id, name: t('mod.' + q.id + '.name'), lines: [] });
}
function modLog(line) {
  const it = [...D.cur.items].reverse().find(i => i.kind === 'module');
  if (it && qItem()?.kind === 'module') it.lines.push(line);
}
function nextStep() {
  const c = D.cur; c.si++; c.st = {};
  if (c.si >= stepsOf(qItem()).length) { c.qi++; c.si = 0; if (c.qi < c.queue.length) beginItem(); }
  save(); render(); scrollTo(0, 0); syncWake();
}
function endSession() {
  const c = D.cur;
  const hasData = c.items.some(i => i.kind === 'test' || i.lines.length);
  if (!confirm(hasData ? t('ui.confirmEnd') : t('ui.confirmDiscard'))) return;
  if (hasData) {
    const p = placeById(c.placeId);
    const s = { id: c.id, date: c.date, placeId: c.placeId, placeName: p ? p.name : '', items: c.items.filter(i => i.kind === 'test' || i.lines.length) };
    D.sessions.unshift(s); lastSaved = s; view = 'summary'; toast(t('ui.saved'));
  } else { view = 'home'; toast(t('ui.nothingToSave')); }
  D.cur = null; save(); render(); scrollTo(0, 0); syncWake();
}
function recordTest(id, v, text, extra = {}) {
  const ts = tstate(id), T = TESTS[id];
  const r = { date: new Date().toISOString(), v, text, sid: D.cur?.id, ...extra };
  if (T.level) {
    r.lvl = ts.level;
    const next = v >= T.level.thr ? +(clamp(ts.level + T.level.step, T.level.step < 0 ? T.level.lim : null, T.level.step > 0 ? T.level.lim : null)).toFixed(2) : ts.level;
    r.nextLvl = next; ts.level = next;
  }
  ts.results.push(r);
  if (D.cur) D.cur.items.push({ kind: 'test', id, name: testName(id), v, text: fmtVal(id, r) + (text ? ' · ' + text : ''), lvl: r.lvl ?? null });
  return r;
}

// =====================================================================
// Förslag, påminnelser och schema
// =====================================================================
function lastDoneModule(id) {
  for (const s of D.sessions) if (s.items.some(i => i.kind === 'module' && i.id === id)) return s.date;
  return null;
}
function lastTest(id) { const r = tstate(id).results; return r.length ? r[r.length - 1] : null; }
function suggestions(place) {
  const out = [];
  for (const g of GROUP_ORDER) {
    const mods = Object.keys(MODULES).filter(id => MODULES[id].grp === g && fits(place, MODULES[id]));
    if (!mods.length) continue;
    mods.sort((a, b) => (lastDoneModule(a) || '').localeCompare(lastDoneModule(b) || ''));   // minst nyligen gjord först
    out.push(mods[0]);
    if (out.length === 2) break;
  }
  return out;
}
function reminders(place) {
  const out = [], now = Date.now(), p = D.period;
  if (p && p.placeId === place.id) {
    const start = new Date(p.start).getTime(), end = start + p.weeks * 7 * DAY;
    if (now >= start && now < end) {
      const week1 = now < start + 7 * DAY, last = now >= end - 7 * DAY;
      if (week1 || last) {
        const since = week1 ? start : end - 7 * DAY;
        const due = Object.keys(TESTS).filter(id => TESTS[id].baseline && fits(place, TESTS[id]) &&
          !tstate(id).results.some(r => new Date(r.date).getTime() >= since));
        if (due.length) out.push({ head: week1 ? t('ui.periodBaseline') : t('ui.periodRetest'), tests: due });
      }
    }
  }
  if (fits(place, TESTS.ball8)) {
    const lt = lastTest('ball8');
    if (!lt || daysSince(lt.date) >= 30) out.push({ head: t('ui.monthly8'), tests: ['ball8'] });
  }
  return out;
}

function render() {

function seriesHTML(step) {
  const st = D.cur.st, place = runPlace(), g = GENS[step.gen];
  if (step.askDist && st.dist == null) {

    return `<h2>${t('ui.chooseDist', { n: step.station })}</h2><div class="numgrid">${nums.map(d => `<button data-act="setDist" data-v="${d}">${d}</button>`).join('')}</div>`;
  }

    st.pendingBalls = st.pendingBalls || step.askBalls;
    return `<h2>${t('ui.chooseBalls')}</h2><div class="stepper"><button data-act="balls" data-d="-4">−</button><output>${st.pendingBalls}</output><button data-act="balls" data-d="4">+</button></div>
      <button class="btn primary huge" data-act="ballsOk">${t('ui.startSeries')}</button>`;
  }
  const len = g.len || D.settings.seriesLen;
  const total = st.total ?? step.balls ?? D.settings.pile;

  st.n = st.n || 0;
  if (st.n >= nSeries) {   // registrering i slutet (myntövningen)
    return `<h2>${t('ui.regEnd', { label: t('reg.' + step.regEnd) })}</h2><div class="numgrid">${Array.from({ length: 11 }, (_, i) => `<button data-act="regEnd" data-v="${i}">${i}</button>`).join('')}</div>`;
  }
  if (!st.cur) {
    const thisLen = Math.min(len, total - st.n * len);
    const s = makeSeries(step.gen, { len: thisLen, place, prevKey: st.lastKey, prevPre: st.lastPre, seriesNo: st.n });
    st.cur = s.shots; st.pre = s.pre; st.lastKey = s.lastKey; save();
  }
  const a = st.n * len + 1, b = st.n * len + st.cur.length;
  let head = '';
  if (step.station) head += `<div class="prog">${t('ui.station', { n: step.station })} · ${st.dist} m</div><div class="sub">${t('ui.aimHole')}</div>`;
  if (step.gen === 'justPast') head += `<div class="head">${t('ui.lengthM', { d: st.pre.dist })}</div><div class="sub">${t('ui.landPast')}</div>`;
  if (step.gen === 'coins') head += `<div class="sub">${t('gen.coinVariant.' + st.pre.variant)}</div>`;
  if (step.gen === 'heights3' && st.pre.flag) head += `<div class="sub">${t('gen.flag', { f: st.pre.flag })}</div>`;
  const explain = g.explain && st.n === 0 ? `<div class="explain">${t('gen.explain')}</div>` : '';
  const shots = st.cur.map((s, i) => `<div class="shot"><span class="n">${a + i}</span><div>${shotHTML(step.gen, s)}</div></div>`).join('');
  const last = st.n + 1 >= nSeries;
  const action = step.reg
    ? `<h3>${t('ui.regAfter', { label: t('reg.' + step.reg) })}</h3><div class="numgrid ${st.cur.length === 3 ? 'c3' : ''}">${Array.from({ length: st.cur.length + 1 }, (_, i) => `<button data-act="regSeries" data-v="${i}">${i}</button>`).join('')}</div>`
    : `<button class="btn primary huge" data-act="nextSeries">${last && !step.regEnd ? t('ui.lastSeries') : t('ui.nextSeries')}</button>`;
  return `${explain}<div class="prog">${t('ui.seriesOf', { i: st.n + 1, n: nSeries })} · ${t('ui.ballsRange', { a, b, t: total })}</div>
    <div class="series">${head}${shots}</div>${action}`;
}
function seriesAdvance(step) {
  const st = D.cur.st, g = GENS[step.gen], len = g.len || D.settings.seriesLen;
  const total = st.total ?? step.balls ?? D.settings.pile, nSeries = Math.ceil(total / len);
  st.lastPre = st.pre; st.cur = null; st.n = (st.n || 0) + 1;
  if (st.n >= nSeries && !step.regEnd) {
    if (step.reg) modLog(t('log.reg', { label: t('reg.' + step.reg), sum: (st.regs || []).reduce((x, y) => x + y, 0), tot: total }));
    else if (step.station) modLog(t('log.station', { n: step.station, d: st.dist, s: nSeries }));
    else modLog(t('log.series', { s: nSeries }));
    nextStep(); return;
  }
  save(); render(); scrollTo(0, 0);
}

// ----- Slumpade längder med GC2/Toptracer -----
const GC2_BUCKETS = [[40, 60], [60, 80], [80, 100], [100, 140]];
const gc2Bucket = d => d < 60 ? 0 : d < 80 ? 1 : d < 100 ? 2 : 3;
function gc2Target(place, prev) {
  const hi = clubOk(place, '9i') ? 140 : 99;   // 100–140 m kräver J9–J7
  let d; do d = 40 + rnd(hi - 39); while (prev != null && Math.abs(d - prev) < 5);   // aldrig samma längd två gånger i rad
  return d;
}
function gc2RandResult(shots) {
  const X = L.test.gc2Rand, mean = a => a.reduce((x, y) => x + y, 0) / a.length, ad = s => Math.abs(s.c - s.d);
  const v = +mean(shots.map(ad)).toFixed(1);
  const buckets = GC2_BUCKETS.map(([a, b], i) => { const inB = shots.filter(s => gc2Bucket(s.d) === i);
    return { r: `${a}–${b}`, n: inB.length, v: inB.length ? +mean(inB.map(ad)).toFixed(1) : null }; });
  const shortPct = Math.round(shots.filter(s => s.c < s.d).length / shots.length * 100);
  const text = [...buckets.filter(x => x.n).map(x => t('test.gc2Rand.bucket', { r: x.r, v: fmtN(x.v), n: x.n })), t('test.gc2Rand.shortPct', { p: shortPct })].join(' · ');
  return { v, text, buckets, shortPct };
}
function gc2StatsHTML(r) {
  const X = L.test.gc2Rand;
  return `<div class="stats"><div class="stat"><span>${t('test.gc2Rand.avgHead')}</span><b>${fmtN(r.v)} m</b></div><div class="stat"><span>${t('test.gc2Rand.shortHead')}</span><b>${r.shortPct} %</b></div>
    ${r.buckets.map(x => `<div class="stat"><span>${x.r} m (${x.n})</span><b>${x.v == null ? t('ui.none') : fmtN(x.v) + ' m'}</b></div>`).join('')}</div>`;
}
function gc2RandHTML() {
  const st = D.cur.st, X = L.test.gc2Rand;
  if (st.total == null) {
    st.pendingBalls = st.pendingBalls || 20;
    return `<h2>${t('ui.chooseBalls')}</h2><div class="stepper"><button data-act="balls" data-d="-4">−</button><output>${st.pendingBalls}</output><button data-act="balls" data-d="4">+</button></div>

    `<tr><td>${i + 1}</td><td>${s.d}</td><td>${fmtN(s.c)}</td><td><b>${fmtS(s.c - s.d) || '0'}</b></td></tr>`).reverse().join('')}</table>` : '';
  const undo = n ? `<button class="btn" data-act="g2Undo">${t('ui.undo')}</button>` : '';
  if (n >= st.total) return `<div class="box">${gc2StatsHTML(r)}</div><button class="btn primary huge" data-act="g2Save">${t('ui.saveResult')}</button>${undo}${list}`;
  if (st.target == null) { st.target = gc2Target(runPlace(), n ? st.shots[n - 1].d : null); save(); }

// ----- AimPoint-kalibrering -----
const AIM_READS = Array.from({ length: 12 }, (_, i) => (i + 1) / 2);   // 0,5–6 % i halva steg
function tiltPct(beta, gamma) {
  // Telefonen platt: lutningen är vinkeln mellan skärmens normal och lodlinjen (fungerar med skärmen upp eller ned).
  const r = Math.PI / 180, c = Math.min(1, Math.abs(Math.cos(beta * r) * Math.cos(gamma * r)));
  return Math.tan(Math.acos(c)) * 100;
}
function aimResult(pts) {
  const X = L.test.aimPoint, devs = pts.map(p => p.r - p.m), mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const v = +mean(devs.map(Math.abs)).toFixed(2), bias = +mean(devs).toFixed(2), d = fmtS(bias, 2) || '0';
  const verdict = bias < -0.25 ? t('test.aimPoint.under', { d }) : bias > 0.25 ? t('test.aimPoint.over', { d }) : t('test.aimPoint.right', { d });
  return { v, bias, text: verdict + ' · ' + t('test.aimPoint.perPoint', { list: devs.map(x => fmtS(x) || '0').join(' ') }) };
}
const aimRow = (p, k) => t('test.aimPoint.row', { i: k + 1, r: fmtN(p.r), m: fmtN(p.m), d: fmtS(p.r - p.m) || '0' }) + (p.src === 'manual' ? ` (${L.test.aimPoint.manualTag})` : '');
function aimHTML() {
  const st = D.cur.st, X = L.test.aimPoint;
  st.pts = st.pts || [];
  const i = st.pts.length;
  const list = i ? `<div class="box small">${st.pts.map(aimRow).join('<br>')}</div>` : '';
  const undo = i ? `<button class="btn" data-act="aimUndo">${t('ui.undo')}</button>` : '';
  if (i >= 10) {
    const r = aimResult(st.pts);
    return `<div class="box"><div class="series"><div class="head">${fmtN(r.v, 2)} %</div><div class="sub">${esc(r.text)}</div></div></div>
      <button class="btn primary huge" data-act="aimFinal">${t('ui.saveResult')}</button>${undo}${list}`;
  }
  let meas = '';
  if (st.read != null) {
    const status = st.meas != null ? t('test.aimPoint.measured', { v: fmtN(st.meas) }) : st.msg ? X[st.msg] : '';
    meas = `<div class="box soft"><p class="small">${X.measHint}</p><button class="btn dark huge" data-act="aimMeasure" id="aimBtn" ${aimBusy ? 'disabled' : ''}>${X.measure}</button>
      <div class="series"><div class="sub" id="aimLive" aria-live="polite">${status}</div></div>
      ${st.manual ? `<label class="f" for="aimMan">${X.manual}</label><div class="row"><input type="number" inputmode="decimal" id="aimMan" style="flex:1"><button class="btn small dark" data-act="aimManual">${X.useManual}</button></div>` : ''}</div>
      ${st.meas != null ? `<button class="btn primary huge" data-act="aimSave">${X.savePoint}</button>` : ''}`;
  }
  return `<div class="shotcard"><div class="no">${t('test.aimPoint.point', { i: i + 1 })}</div><h3>${X.yourRead}</h3>
    <div class="numgrid aim">${AIM_READS.map(v => `<button data-act="aimRead" data-v="${v}" aria-pressed="${st.read === v}">${fmtN(v)}</button>`).join('')}</div></div>${meas}${list}${undo}`;
}
let aimBusy = false;
async function aimMeasure() {
  const st = D.cur.st, X = L.test.aimPoint, live = () => $('#aimLive');
  const fail = msg => { aimBusy = false; if (D.cur?.st !== st) return; st.msg = msg; st.manual = true; st.meas = null; rerender(); };
  if (aimBusy) return;
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return fail('noSensor');
  if (typeof DOE.requestPermission === 'function') {   // iOS kräver tillstånd, och frågan måste komma från ett tryck
    try { if (await DOE.requestPermission() !== 'granted') return fail('noSensor'); } catch { return fail('noSensor'); }
  }
  aimBusy = true; st.meas = null; st.msg = null;
  const btn = $('#aimBtn'); if (btn) btn.disabled = true;
  let samples = [], run = false;
  const on = e => { if (e.beta == null || e.gamma == null) return; const p = tiltPct(e.beta, e.gamma);
    if (run) { samples.push(p); if (live()) live().textContent = t('test.aimPoint.measuring', { v: fmtN(p) }); } };
  addEventListener('deviceorientation', on);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  for (let s = 3; s > 0; s--) { if (live()) live().textContent = t('test.aimPoint.countdown', { s }); await wait(1000); }
  run = true; await wait(2000);
  removeEventListener('deviceorientation', on);
  if (samples.length < 5) return fail('noSensor');
  const m = samples.reduce((a, b) => a + b, 0) / samples.length;
  const sd = Math.sqrt(samples.reduce((a, b) => a + (b - m) ** 2, 0) / samples.length);
  if (sd > 0.4) return fail('unstable');
  aimBusy = false;
  if (D.cur?.st !== st) return;
  st.meas = +m.toFixed(1); st.src = 'sensor'; rerender();
}

function shotsResult(id, picks) {

function driverHcp(avgLen, avgSide) {
  // Avrunda till det sämre värdet: kortare längd (rad nedåt), större sidledsmiss (kolumn uppåt).
  if (avgLen < DRIVER_LENS[0]) return null;
  let ri = 0; DRIVER_LENS.forEach((l, i) => { if (l <= avgLen) ri = i; });
  const col = Math.max(1, Math.ceil(avgSide - 1e-9));
  if (col > 30) return null;
  return DRIVER_HCP[ri][col - 1];
}
function driverCat(h) {

  return r <= -37 ? C.tb : r <= -19 ? C.db : r <= -10 ? C.bogey : r <= -1 ? C.single : r <= 3 ? C.elite : r <= 9 ? C.world : C.dream;
}
function driverResult(drives) {

  const al = drives.reduce((a, d) => a + d.len, 0) / drives.length, as = drives.reduce((a, d) => a + Math.abs(d.side), 0) / drives.length;

}

function chartSVG(vals, higher) {
  const W = 300, H = 100, P = 16;
  if (vals.length === 1) vals = [vals[0], vals[0]];
  const mn = Math.min(...vals), mx = Math.max(...vals), span = mx - mn || 1;
  const x = i => P + i * (W - 2 * P) / (vals.length - 1), y = v => H - P - (v - mn) / span * (H - 2 * P);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><line x1="${P}" y1="${y(mx)}" x2="${W - P}" y2="${y(mx)}"/><line x1="${P}" y1="${y(mn)}" x2="${W - P}" y2="${y(mn)}"/>
    <polyline points="${pts}"/>${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4"/>`).join('')}
    <text x="2" y="${y(mx) - 3}">${fmtN(mx)}</text><text x="2" y="${y(mn) + 13}">${fmtN(mn)}</text></svg>`;
}

async function shareText(text) {
  if (navigator.share) { try { await navigator.share({ title: t('ui.shareTitle'), text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast(t('ui.copied')); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(t('ui.copied')); } catch { toast(t('ui.copyFail')); }
    ta.remove();
  }
}
async function exportData() {
  const name = `golftraning-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const blob = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.v !== 2 || !Array.isArray(d.sessions) || !Array.isArray(d.places)) throw new Error('bad');
      if (!confirm(t('ui.importConfirm', { n: d.sessions.length }))) return;
      const base = defaults(); D = { ...base, ...d, settings: { ...base.settings, ...d.settings } };
      save(); applyTheme(); view = D.cur ? 'run' : 'home'; render(); toast(t('ui.importOk'));
    } catch { toast(t('ui.importBad')); }
  };
  r.readAsText(f); e.target.value = '';
});

}

  // serier
  setDist(el) { D.cur.st.dist = +el.dataset.v; rerender(); },
  balls(el) { const st = D.cur.st; st.pendingBalls = clamp(st.pendingBalls + +el.dataset.d, 4, 200); rerender(); },
  ballsOk() { const st = D.cur.st; st.total = st.pendingBalls; rerender(); },
  nextSeries() { seriesAdvance(curStep()); },
  regSeries(el) { const st = D.cur.st; (st.regs = st.regs || []).push(+el.dataset.v); seriesAdvance(curStep()); },
  regEnd(el) { modLog(t('log.coins', { v: el.dataset.v })); nextStep(); },
  // leapfrog
  streak(el) { const st = D.cur.st; st.now = Math.max(0, (st.now || 0) + +el.dataset.d); rerender(); },
  streakSave() { const st = D.cur.st; if (!st.now) return; st.tries.push(st.now); st.now = 0; rerender(); },
  streakDone() { const st = D.cur.st; if (st.now) st.tries.push(st.now); if (st.tries.length) modLog(t('log.streak', { b: Math.max(...st.tries), n: st.tries.length })); nextStep(); },
  // längdtabell
  yW(el) { D.cur.st.w = el.dataset.w; rerender(); },
  ySign(el) { const st = D.cur.st, sw = el.dataset.sw, v = D.yardage[st.w]?.[sw]; const curS = st.sign[sw] || (v && v.side < 0 ? 'L' : 'R');
    st.sign[sw] = curS === 'L' ? 'R' : 'L'; el.textContent = st.sign[sw] === 'L' ? t('ui.left') : t('ui.right'); save(); },
  ySave(el) { const st = D.cur.st, sw = el.dataset.sw, c = num('#c-' + sw), s = num('#s-' + sw);
    if (c == null) return; const old = D.yardage[st.w]?.[sw];
    const sign = (st.sign[sw] || (old && old.side < 0 ? 'L' : 'R')) === 'L' ? -1 : 1;
    (D.yardage[st.w] = D.yardage[st.w] || {})[sw] = { carry: c, side: s == null ? 0 : sign * Math.abs(s), date: new Date().toISOString() };
    st.count = (st.count || 0) + 1; save(); toast(`${club(st.w)} ${t('swing.' + sw)}: ${fmtN(c)} m`); },
  yDone() { const n = D.cur.st.count || 0; if (n) modLog(t('log.yardage', { n })); nextStep(); },
  // spökhål
  ghostReg(el) { modLog(t('log.ghost', { v: el.dataset.v })); nextStep(); },
  // slumpade längder
  g2Reg() { const st = D.cur.st, c = num('#carry'); if (c == null || st.target == null) return; st.shots.push({ d: st.target, c }); st.target = null; rerender(); setTimeout(() => $('#carry')?.focus(), 0); },
  g2Undo() { const st = D.cur.st, s = st.shots.pop(); if (s) st.target = s.d; rerender(); },
  g2Save() { const st = D.cur.st, r = gc2RandResult(st.shots); st.result = recordTest('gc2Rand', r.v, r.text, { buckets: r.buckets, shortPct: r.shortPct, shots: st.shots.slice() }); rerender(); scrollTo(0, 0); },
  // AimPoint
  aimRead(el) { const st = D.cur.st; st.read = +el.dataset.v; rerender(); },
  aimMeasure() { aimMeasure(); },
  aimManual() { const st = D.cur.st, v = num('#aimMan'); if (v == null || v < 0 || v > 20) return; st.meas = +v.toFixed(1); st.src = 'manual'; rerender(); },
  aimSave() { const st = D.cur.st; if (st.read == null || st.meas == null) return; st.pts.push({ r: st.read, m: st.meas, src: st.src });
    st.read = st.meas = st.msg = null; st.manual = false; rerender(); scrollTo(0, 0); },
  aimUndo() { D.cur.st.pts.pop(); rerender(); },
  aimFinal() { const st = D.cur.st, r = aimResult(st.pts); st.result = recordTest('aimPoint', r.v, r.text, { bias: r.bias, pts: st.pts.slice() }); rerender(); scrollTo(0, 0); },
  // tester
  cntPick(el) { D.cur.st.pick = +el.dataset.v; rerender(); },
  cntSave() { const st = D.cur.st, id = curStep().test; if (st.pick == null) return; st.result = recordTest(id, st.pick, ''); rerender(); scrollTo(0, 0); },
  shotPick(el) { D.cur.st.picks.push(isNaN(+el.dataset.k) ? el.dataset.k : +el.dataset.k); rerender(); },
  shotsUndo() { D.cur.st.picks.pop(); rerender(); },
  shotsSave() { const st = D.cur.st, id = curStep().test, r = shotsResult(id, st.picks); st.result = recordTest(id, r.v, r.text, { picks: st.picks.slice() }); rerender(); scrollTo(0, 0); },
  tsVar(el) { D.cur.st.variant = el.dataset.v; rerender(); },
  tsSet(el) { const st = D.cur.st; st.c[st.line][el.dataset.d] = +el.dataset.v; rerender(); },
  tsEx(el) { const st = D.cur.st, x = st.x[st.line]; x[el.dataset.k] = Math.max(0, (x[el.dataset.k] || 0) + +el.dataset.d); rerender(); },
  tsNext() { D.cur.st.line++; rerender(); scrollTo(0, 0); },
  tsBack() { D.cur.st.line--; rerender(); scrollTo(0, 0); },
  tsSave() { const st = D.cur.st, r = twoSixResult(st); st.result = recordTest('twoSix', r.v, r.text, { of: r.of, per: r.per, variant: st.variant }); rerender(); scrollTo(0, 0); },
  drvDir(el) { D.cur.st.dir = el.dataset.v; document.querySelectorAll('[data-act=drvDir]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === el.dataset.v)); save(); },
  drvReg() { const st = D.cur.st, l = num('#dLen'), s = num('#dSide'); if (l == null) return;
    st.drives.push({ len: l, side: (s || 0) * (st.dir === 'L' ? -1 : 1) }); rerender(); setTimeout(() => $('#dLen')?.focus(), 0); },
  drvUndo() { D.cur.st.drives.pop(); rerender(); },
  drvSave() { const st = D.cur.st, r = driverResult(st.drives); st.result = recordTest('driver', r.v, r.text, { avgLen: r.avgLen, avgSide: r.avgSide }); rerender(); scrollTo(0, 0); },
  testDone() { nextStep(); },
  // historik
  shareSession(el) { const s = D.sessions.find(x => x.id === el.dataset.id); if (s) shareText(sessionText(s)); },
  delSession(el) { if (!confirm(t('ui.confirmDelete'))) return; D.sessions = D.sessions.filter(x => x.id !== el.dataset.id); rerender(); },
  // inställningar
  setPile(el) { D.settings.pile = clamp(D.settings.pile + +el.dataset.d, 10, 21); rerender(); },
  setLen(el) { D.settings.seriesLen = clamp(D.settings.seriesLen + +el.dataset.d, 3, 5); rerender(); },
  setFlags(el) { D.settings.flags = +el.dataset.v; rerender(); },
  editPlace(el) { editPlaceId = el.dataset.id; view = 'placeEdit'; render(); scrollTo(0, 0); },
  addPlace() { const p = { id: uid(), name: t('ui.newPlace'), st: {}, maxClub: 'D' }; D.places.push(p); editPlaceId = p.id; view = 'placeEdit'; rerender(); scrollTo(0, 0); },
  savePlace() { const p = placeById(editPlaceId); p.name = $('#pName').value.trim() || p.name; p.st = {};
    document.querySelectorAll('[data-st]').forEach(c => { if (c.checked) p.st[c.dataset.st] = 1; }); p.maxClub = $('#pMax').value;
    view = 'settings'; rerender(); toast(p.name); },
  delPlace() { const p = placeById(editPlaceId); if (!p || D.places.length < 2 || !confirm(t('ui.confirmDeletePlace', { name: p.name }))) return;
    D.places = D.places.filter(x => x.id !== p.id); if (D.placeId === p.id) D.placeId = D.places[0].id; if (D.period?.placeId === p.id) D.period = null; view = 'settings'; rerender(); },
  periodSet() { const s = $('#pStart').value; if (!s) return; D.period = { placeId: curPlace().id, start: new Date(s + 'T00:00').toISOString(), weeks: +$('#pWeeks').value }; rerender(); },
  periodEnd() { D.period = null; rerender(); },
  export() { exportData(); },
  import() { $('#importFile').click(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && ACTS[el.dataset.act]) ACTS[el.dataset.act](el);
});

// =====================================================================
// Start
// =====================================================================
applyTheme(); save(); render(); syncWake();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
